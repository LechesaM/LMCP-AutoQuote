apiVersion: v1
kind: ConfigMap
metadata:
  name: lmcp-runtime-config
data:
  LMCP_ENV: staging
  LMCP_DEPLOYMENT_PROFILE: distributed-staging
  LMCP_ALLOW_FINAL_AUTOMATION: "false"
  LMCP_DRY_RUN_MODE: "true"
  LMCP_REQUIRE_HUMAN_SUPERVISION: "true"
  LMCP_SUBMISSION_LOCK_FILE: /app/runtime/staging/go_live_guards/submission_locks.json
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
