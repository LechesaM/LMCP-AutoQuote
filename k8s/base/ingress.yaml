apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lmcp-ingress-placeholder
  annotations:
    lmcp.io/public-exposure: "disabled"
    lmcp.io/internal-routing: "enabled"
    lmcp.io/external-routing: "disabled"
    lmcp.io/admin-access: "internal-only"
    lmcp.io/observability-access: "internal-only"
    cert-manager.io/cluster-issuer: placeholder-issuer
spec:
  ingressClassName: internal-placeholder
  tls:
    - secretName: tls-secret-placeholder
      hosts:
        - placeholder.lmcp.local
  rules:
    - host: placeholder.lmcp.local
      http:
        paths:
          - path: /rfq-lifecycle
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /observability
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
