overview:
  title: AutoQuote Non-Runtime Workstream
  subtitle: Documentation-only libraries for supplier intelligence, tender screening, profitability rules, and operating standards.
  safety_note: Read-only reference material. No workflow transitions, submission authority, or runtime controls are changed.
supplier_pricing_intelligence:
  datasets:
    - id: supplier-register
      title: Supplier Register
      items:
        - supplier name
        - category coverage
        - province coverage
        - contact details
        - lead-time profile
        - preferred wholesaler flag
        - reliability notes
        - last verified date
    - id: product-catalog
      title: Product Catalog
      items:
        - category
        - product name
        - unit of measure
        - approved supplier list
        - standard pack size
        - alternate brands
        - price band
        - margin floor
    - id: historical-pricing
      title: Historical Pricing Register
      items:
        - quote reference
        - quote date
        - validity period
        - quoted unit price
        - quoted total
        - VAT treatment
        - delivery assumptions
        - source type
    - id: lead-times
      title: Lead Time Register
      items:
        - standard lead time
        - urgent lead time
        - province impact
        - stock dependency
        - delivery complexity
        - seasonal variation
    - id: preferred-wholesalers
      title: Preferred Wholesaler Register
      items:
        - price consistency
        - delivery reliability
        - province coverage
        - evidence quality
        - "status: preferred, approved, conditional, avoid"
  starter_supplier_segments:
    - office furniture suppliers
    - PPE suppliers
    - electrical suppliers
    - construction material suppliers
    - cleaning chemical suppliers
    - stationery suppliers
    - hardware and tools suppliers
    - packaging suppliers
    - janitorial consumables suppliers
  provincial_coverage:
    - Gauteng
    - Western Cape
    - KwaZulu-Natal
    - Eastern Cape
    - Free State
    - Limpopo
    - Mpumalanga
    - North West
    - Northern Cape
