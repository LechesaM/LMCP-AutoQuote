apiVersion: apps/v1
kind: Deployment
metadata:
  name: warm-standby-placeholder
spec:
  replicas: 2
  selector:
    matchLabels:
      app: warm-standby-placeholder
  template:
    metadata:
      labels:
        app: warm-standby-placeholder
    spec:
      containers:
        - name: warm-standby
          image: ghcr.io/lmcp/warm-standby:placeholder
          env:
            - name: standby_mode
              value: placeholder
            - name: standby_region
              value: placeholder
            - name: warm_standby_status
              value: placeholder
