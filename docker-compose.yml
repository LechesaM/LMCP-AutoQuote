services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./runtime:/app/runtime
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build:
      context: .
      dockerfile: frontend/command-centre/Dockerfile
    env_file:
      - .env
    ports:
      - "4173:80"
    depends_on:
      - backend
