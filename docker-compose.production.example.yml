services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.production.example
    environment: &production-env
      LMCP_ENV: production
      LMCP_PRODUCTION_MODE: locked_production
      LMCP_DEPLOYMENT_PROFILE: production
      STRICT_PRODUCTION_STARTUP: "1"
      LMCP_ALLOW_DEGRADED_STARTUP: "false"
      LMCP_ALLOW_FINAL_AUTOMATION: "false"
      LMCP_DRY_RUN_MODE: "true"
      LMCP_REQUIRE_HUMAN_SUPERVISION: "true"
      LMCP_RUNTIME_SAFETY_ENABLED: "1"
      LMCP_ENABLE_LEGACY_ROUTERS: "0"
      LMCP_OBSERVABILITY_ENABLED: "1"
      LMCP_SECRET_KEY: ${LMCP_SECRET_KEY:-change-me-production-secret}
      LMCP_CORS_ORIGINS: ${LMCP_CORS_ORIGINS:-https://lmcp.example.com}
      LMCP_OPERATOR_SESSION_COOKIE_SECURE: "true"
      LMCP_OPERATOR_AUTH_ALLOW_DEV_FALLBACK: "false"
      LMCP_ACCESS_GOVERNANCE_PROFILE: locked_production
      LMCP_RBAC_ROLES: operator,supervisor,security_admin,release_manager,executive_override,production_observer
      LMCP_SUPERVISION_ROLES: operator,supervisor
      LMCP_EXECUTIVE_OVERRIDE_ROLES: executive_override
      LMCP_DEPLOYMENT_ACCESS_SEGREGATION: "true"
      LMCP_OBSERVABILITY_ACCESS_SEGREGATION: "true"
      LMCP_ADMIN_ESCALATION_ROLES: security_admin,release_manager
      LMCP_PRODUCTION_LOCK_ENFORCED: "true"
      LMCP_AUDIT_RETENTION_ENFORCED: "true"
      LMCP_DB_BACKEND: postgres
      LMCP_QUEUE_BACKEND: redis
      LMCP_DATABASE_URL: postgresql://${POSTGRES_USER:-lmcp_production}:${POSTGRES_PASSWORD:-change-me-production-db}@postgres:5432/${POSTGRES_DB:-lmcp_production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-lmcp_production}:${POSTGRES_PASSWORD:-change-me-production-db}@postgres:5432/${POSTGRES_DB:-lmcp_production}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      LMCP_PROJECT_ROOT: /app
      LMCP_RUNTIME_DIR: /app/runtime/production
      LMCP_MONTHLY_QUOTES_DIR: /app/runtime/production/monthly_quotes
      LMCP_LOG_DIR: /app/runtime/production/logs
      LMCP_HEALTH_DIR: /app/runtime/production/health
      LMCP_EXPORTS_DIR: /app/runtime/production/exports
      LMCP_TEMP_DIR: /app/runtime/production/tmp
      LMCP_BACKUPS_DIR: /app/runtime/production/backups
      LMCP_AUDIT_TRAIL_DIR: /app/runtime/production/audit_trail
      LMCP_SUBMISSION_HISTORY_DIR: /app/runtime/production/submission_history
      LMCP_LOCKS_DIR: /app/runtime/production/locks
      LMCP_SUBMISSION_PROOFS_DIR: /app/runtime/production/submission_proofs
      LMCP_PORTAL_SUBMISSION_DIR: /app/runtime/production/portal_submission
      LMCP_FINAL_SUBMISSION_DIR: /app/runtime/production/final_submission_v47_5
      LMCP_PROOF_CENTER_DIR: /app/runtime/production/proof_center
      LMCP_MANUAL_PRODUCTION_DIR: /app/runtime/production/manual_production
      LMCP_MANUAL_PRODUCTION_DB_PATH: /app/runtime/production/manual_production/lmcp_operations.db
      LMCP_SUBMISSION_LOCK_FILE: /app/runtime/production/go_live_guards/submission_locks.json
      LMCP_OPERATOR_AUTH_DIR: /app/runtime/production/operator_auth
      LMCP_OPERATOR_AUTH_DB_PATH: /app/runtime/production/operator_auth/operator_auth.sqlite3
      LMCP_HANDWRITING_RUNTIME_DIR: /app/runtime/production/handwriting_simulation
      LMCP_TENDER_FORM_RUNTIME_DIR: /app/runtime/production/tender_form_intelligence
      LMCP_CLICKABLE_NAVIGATION_RUNTIME_DIR: /app/runtime/production/clickable_navigation_v40
      LMCP_AUDIT_RETENTION_DAYS: "3650"
      LMCP_LOG_RETENTION_DAYS: "365"
      PORTAL_ISOLATION_ENABLED: "true"
      PORTAL_ISOLATION_STATE_FILE: /app/runtime/production/portal_isolation_state.json
      PORTAL_ISOLATION_FAILURE_THRESHOLD: "3"
      PORTAL_ISOLATION_MINUTES: "60"
      LMCP_BACKEND_URL: http://backend:8000
      LMCP_FRONTEND_URL: http://127.0.0.1:${LMCP_FRONTEND_HOST_PORT:-4176}
      LMCP_PRODUCTION_SUBMISSION_USERNAME: ${LMCP_PRODUCTION_SUBMISSION_USERNAME:-}
      LMCP_PRODUCTION_SUBMISSION_PASSWORD: ${LMCP_PRODUCTION_SUBMISSION_PASSWORD:-}
      LMCP_PRODUCTION_PORTAL_USERNAME: ${LMCP_PRODUCTION_PORTAL_USERNAME:-}
      LMCP_PRODUCTION_PORTAL_PASSWORD: ${LMCP_PRODUCTION_PORTAL_PASSWORD:-}
    command:
      [
        "uvicorn",
        "${LMCP_APP_ENTRYPOINT:-app.main:app}",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    ports:
      - "${LMCP_BACKEND_HOST_PORT:-8013}:8000"
    volumes:
      - ./runtime/production:/app/runtime/production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.production.example
    environment:
      <<: *production-env
    command:
      [
        "celery",
        "-A",
        "app.celery_app.celery_app",
        "worker",
        "--loglevel=INFO",
        "--hostname=lmcp-production-worker@%h",
      ]
    volumes:
      - ./runtime/production:/app/runtime/production
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  operations-worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.production.example
    environment:
      <<: *production-env
    command:
      [
        "celery",
        "-A",
        "app.celery_app.celery_app",
        "worker",
        "--loglevel=INFO",
        "--hostname=lmcp-production-operations@%h",
        "--queues=operations_queue",
      ]
    volumes:
      - ./runtime/production:/app/runtime/production
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.production.example
    environment:
      <<: *production-env
      DAILY_SUPERVISED_PRODUCTION_RITUAL_INTERVAL_HOURS: ${DAILY_SUPERVISED_PRODUCTION_RITUAL_INTERVAL_HOURS:-24}
    command:
      [
        "celery",
        "-A",
        "app.celery_app.celery_app",
        "beat",
        "--loglevel=INFO",
      ]
    volumes:
      - ./runtime/production:/app/runtime/production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: frontend/command-centre/Dockerfile
      args:
        NGINX_CONF: nginx/production.conf
    env_file:
      - .env.production.example
    environment:
      LMCP_BACKEND_URL: http://backend:8000
    ports:
      - "${LMCP_FRONTEND_HOST_PORT:-4176}:80"
    volumes:
      - ./runtime/production:/app/runtime/production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.production.example
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lmcp_production}
      POSTGRES_USER: ${POSTGRES_USER:-lmcp_production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-production-db}
    ports:
      - "${LMCP_POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - postgres_production_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lmcp_production} -d ${POSTGRES_DB:-lmcp_production}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    env_file:
      - .env.production.example
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${LMCP_REDIS_HOST_PORT:-6381}:6379"
    volumes:
      - redis_production_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v2.54.1
    env_file:
      - .env.production.example
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "${LMCP_PROMETHEUS_HOST_PORT:-9092}:9090"
    volumes:
      - ./docker/prometheus:/etc/prometheus:ro
      - prometheus_production_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.2.2
    env_file:
      - .env.production.example
    environment:
      GF_SECURITY_ADMIN_USER: ${LMCP_GRAFANA_ADMIN_USER:-lmcp_observer}
      GF_SECURITY_ADMIN_PASSWORD: ${LMCP_GRAFANA_ADMIN_PASSWORD:-change-me-grafana}
    ports:
      - "${LMCP_GRAFANA_HOST_PORT:-3002}:3000"
    volumes:
      - grafana_production_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_production_data:
  redis_production_data:
  prometheus_production_data:
  grafana_production_data:
