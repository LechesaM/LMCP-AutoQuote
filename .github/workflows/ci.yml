name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  frontend-and-autoquote:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/command-centre
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/command-centre/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify AutoQuote libraries
        run: npm run check:autoquote-libraries

      - name: Build frontend
        run: npm run build
