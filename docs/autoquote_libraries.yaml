operator_handbook:
  sections:
    - title: Tender Review Handbook
      items:
        - Confirm the RFQ is in scope.
        - Check category fit against the category library.
        - Check submission method and compliance requirements.
        - Check briefing session requirements.
        - Check delivery complexity and lead time.
        - Check supplier coverage and pricing evidence.
        - Decide whether to continue, hold, or reject.
    - title: Pricing Review Handbook
      items:
        - Confirm the supplier and product match.
        - Check whether the price is current or stale.
        - Check delivery and VAT assumptions.
        - Compare against historical pricing.
        - Apply profitability rules.
        - Record confidence and override notes.
    - title: Submission Package Handbook
      items:
        - Confirm the submission pack contents are complete.
        - Confirm quote pricing matches the approved internal record.
        - Confirm proof documents are attached where required.
        - Confirm naming, formatting, and version control.
        - Confirm the pack is ready for manual submission handling.
    - title: Incident Response Guide
      items:
        - Stop the affected action.
        - Capture what happened.
        - Record timestamps, file names, and screenshots if relevant.
        - Preserve evidence.
        - Notify the responsible operator or supervisor.
        - Escalate for investigation if workflow integrity may be affected.
profitability_rules:
  rules:
    - "Minimum profit target: R30,000"
    - "Minimum margin assumption: 25%"
    - Supply-only preferred
    - No briefing session tenders unless explicitly reviewed
    - All provinces in scope unless category evidence suggests otherwise
  outcomes:
    - GO
    - REVIEW
    - HOLD
    - NO_GO
test_rfq_library:
  scenarios:
    - title: Small RFQs
      items:
        - stationery top-up
        - PPE replenishment
        - cleaning chemical order
        - office accessories order
    - title: Medium RFQs
      items:
        - office furniture plus stationery
        - electrical consumables plus PPE
        - cleaning chemicals plus janitorial supplies
        - hardware plus safety signage
    - title: Large RFQs
      items:
        - construction materials across multiple line items
        - mixed supply-and-delivery procurement bundle
        - multi-province delivery requirement
    - title: Multi-Line-Item RFQs
      items:
        - ten or more line items
        - mixed unit types
        - mixed price bands
        - mixed supplier availability
    - title: Edge-Case RFQs
      items:
        - briefing session required
        - missing delivery details
        - unclear submission method
        - stale supplier quote
        - blocked category present
        - inconsistent VAT treatment
        - unrealistic delivery window
        - province coverage gap
